name: biyuya
description: "Shared household expense tracker with offline capture and per-category budgets."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.0.0
  connectivity_plus: ^7.0.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.5
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.1
  google_fonts: ^8.0.1
  intl: ^0.20.2
  logger: ^2.2.0
  material_ui: ^1.2.0
  multiple_result: ^5.1.0
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.2
  skeletonizer: ^2.1.3
  supabase_flutter: ^2.16.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.0
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.0+1
  very_good_analysis: ^11.0.0

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/logo.jpeg
    - images/logo_no_background.png
    - images/confused_error_image.jpeg
    - images/empty_image.jpeg

