name: biyuya
description: "Shared household expense tracker with offline capture and per-category budgets."

publish_to: 'none' # Remove this line if you wish to publish your app to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  app_links: ^7.0.0
  connectivity_plus: ^7.0.0
  equatable: ^2.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  intl: ^0.20.3
  logger: ^2.8.0
  material_ui: ^1.5.0
  multiple_result: ^5.3.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  skeletonizer: ^3.0.0
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
